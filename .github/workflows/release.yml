name: Compile Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Compile release builds"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Resolve release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "/^\[crossink\]$/,/^\[/s/^version = .*/version = $VERSION/" platformio.ini

      - name: Build RetroInk
        env:
          CROSSINK_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: pio run -j1 -e default

      - name: Package license and checksum
        run: |
          cd .pio/build/default
          sha256sum "firmware-x3-x4-v${{ env.RELEASE_VERSION }}.bin" > \
            "firmware-x3-x4-v${{ env.RELEASE_VERSION }}.bin.sha256"
          cp ../../../LICENSE ../../../NOTICE.md .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: true
          body: |
            RetroInk by AltFlow, built on CrossInk 1.5.0 and CrossPoint Reader.

            Install `firmware-x3-x4-v${{ env.RELEASE_VERSION }}.bin` on an Xteink X3 or X4.
            The source, license, upstream attribution, and recovery instructions are included in this repository.
          files: |
            .pio/build/default/firmware-x3-x4-v${{ env.RELEASE_VERSION }}.bin
            .pio/build/default/firmware-x3-x4-v${{ env.RELEASE_VERSION }}.bin.sha256
            .pio/build/default/LICENSE
            .pio/build/default/NOTICE.md
